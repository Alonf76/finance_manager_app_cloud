# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # השלב החסר: התקנת Flutter על השרת
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'any' # וודא שזו הגרסה שאתה משתמש בה
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # העתק והדבק את השם המדויק שמצאת ב-GitHub
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALON_FINANCE_FINAL }}
          projectId: family-biz-finance
          channelId: live