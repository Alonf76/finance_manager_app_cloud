name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. התקנת Flutter (אותו דבר כמו ב-merge)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      # 2. התקנת חבילות
      - name: Install dependencies
        run: flutter pub get

      # 3. בנייה (אותו דבר כמו ב-merge)
      - name: Build Web
        run: flutter build web --release

      # 4. פריסה לתצוגה מקדימה (Preview)
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FAMILY_BIZ_FINANCE }}'
          projectId: family-biz-finance